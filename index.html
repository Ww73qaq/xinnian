<body>
  <div class="container">
    <header>
      <h1>💫 心念星辰</h1>
      <p>记录生活中的闪耀瞬间</p>
    </header>
    
    <main>
      <div class="stats">
        <div class="star-count" id="starCount">0</div>
        <div class="last-reset" id="lastReset">今天的星星</div>
      </div>
      
      <div class="stars-display" id="starsDisplay">
        <!-- 星星将在这里动态生成 -->
      </div>
      
      <div class="actions">
        <button class="star-btn" id="addStarBtn" aria-label="添加一颗星星">
          <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.21L7 14.14 2 9.21l6.91-1.02L12 2z"/>
          </svg>
          添加星星
        </button>
      </div>
    </main>
    
    <footer>
      <p>⭐ 星星存储在您的浏览器中，断网也能使用</p>
      <p>零点自动重置，每天新的开始</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
